name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs the same script a developer runs locally before pushing, so a
      # green CI run and a green local run always mean the same thing.
      - name: Run checks
        run: ./scripts/check.sh
